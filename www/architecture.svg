<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">ESP32 BT2AM — System Overview</text>

  <!-- Phone -->
  <g>
    <rect x="30" y="90" width="130" height="230" rx="18" fill="#1f2937"/>
    <rect x="42" y="112" width="106" height="170" rx="4" fill="#e0f2fe"/>
    <circle cx="95" cy="298" r="8" fill="#374151"/>
    <path d="M60 150 q35 -22 70 0" stroke="#0284c7" stroke-width="3" fill="none"/>
    <circle cx="95" cy="200" r="26" fill="#38bdf8"/>
    <path d="M85 190 l0 20 l14 -10 z" fill="#fff"/>
    <text x="95" y="345" text-anchor="middle" font-size="15" fill="#111">Phone / PC</text>
    <text x="95" y="364" text-anchor="middle" font-size="12" fill="#555">(A2DP source)</text>
  </g>

  <path d="M162 200 L228 200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="185" text-anchor="middle" font-size="12" fill="#333">Bluetooth</text>
  <text x="195" y="225" text-anchor="middle" font-size="12" fill="#333">A2DP (SBC)</text>

  <!-- ESP32 outer box -->
  <rect x="230" y="70" width="520" height="420" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="490" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">ESP32 (dual core)</text>

  <!-- Core 0 -->
  <rect x="252" y="118" width="230" height="350" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="367" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Core 0 — background</text>

  <rect x="268" y="156" width="198" height="52" rx="6" fill="#c7d2fe"/>
  <text x="367" y="178" text-anchor="middle" font-size="12" fill="#1e1b4b">Bluedroid / A2DP sink</text>
  <text x="367" y="196" text-anchor="middle" font-size="11" fill="#1e1b4b">+ AVRCP auto-play</text>

  <path d="M367 208 L367 232" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="268" y="234" width="198" height="52" rx="6" fill="#c7d2fe"/>
  <text x="367" y="254" text-anchor="middle" font-size="12" fill="#1e1b4b">Mono downmix (L+R)</text>
  <text x="367" y="272" text-anchor="middle" font-size="11" fill="#1e1b4b">8-bit ring + 16-bit ring</text>

  <path d="M367 286 L367 310" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="268" y="312" width="198" height="66" rx="6" fill="#ddd6fe"/>
  <text x="367" y="332" text-anchor="middle" font-size="12" fill="#1e1b4b">DTMF task</text>
  <text x="367" y="349" text-anchor="middle" font-size="11" fill="#1e1b4b">Goertzel detector</text>
  <text x="367" y="365" text-anchor="middle" font-size="11" fill="#1e1b4b">low priority, polling</text>

  <text x="367" y="408" text-anchor="middle" font-size="11" fill="#4338ca">"*#0847#" → retune</text>
  <text x="367" y="424" text-anchor="middle" font-size="11" fill="#4338ca">carrier to 847 kHz</text>

  <!-- Core 1 -->
  <rect x="500" y="118" width="230" height="350" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="615" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Core 1 — hard real-time</text>

  <rect x="516" y="156" width="198" height="52" rx="6" fill="#fecaca"/>
  <text x="615" y="176" text-anchor="middle" font-size="12" fill="#7f1d1d">NCO</text>
  <text x="615" y="194" text-anchor="middle" font-size="11" fill="#7f1d1d">phase accumulator + sine LUT</text>

  <path d="M615 208 L615 232" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="516" y="234" width="198" height="52" rx="6" fill="#fecaca"/>
  <text x="615" y="254" text-anchor="middle" font-size="12" fill="#7f1d1d">Q15 AM mixer</text>
  <text x="615" y="272" text-anchor="middle" font-size="11" fill="#7f1d1d">carrier × (1 + audio·gain)</text>

  <path d="M615 286 L615 310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="516" y="312" width="198" height="52" rx="6" fill="#fecaca"/>
  <text x="615" y="332" text-anchor="middle" font-size="12" fill="#7f1d1d">I2S0 parallel DMA</text>
  <text x="615" y="350" text-anchor="middle" font-size="11" fill="#7f1d1d">8-bit output, 4 MSPS</text>

  <text x="615" y="404" text-anchor="middle" font-size="11" fill="#991b1b">~60 CPU cycles</text>
  <text x="615" y="420" text-anchor="middle" font-size="11" fill="#991b1b">budget per sample</text>

  <!-- dashed cross-core link -->
  <path d="M470 345 C 490 345, 495 345, 512 345" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="490" y="332" text-anchor="middle" font-size="10" fill="#9333ea">retune</text>

  <!-- output to DAC -->
  <path d="M752 340 L818 340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="325" text-anchor="middle" font-size="12" fill="#333">8× GPIO</text>
  <text x="785" y="360" text-anchor="middle" font-size="12" fill="#333">+ PCLK</text>

  <!-- DAC -->
  <g>
    <rect x="820" y="300" width="90" height="80" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="865" y="335" text-anchor="middle" font-size="12" fill="#78350f">R-2R</text>
    <text x="865" y="352" text-anchor="middle" font-size="12" fill="#78350f">DAC</text>
  </g>

  <path d="M912 340 L960 340" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- antenna / RF -->
  <g>
    <line x1="965" y1="340" x2="965" y2="250" stroke="#333" stroke-width="3"/>
    <line x1="965" y1="250" x2="945" y2="220" stroke="#333" stroke-width="3"/>
    <line x1="965" y1="250" x2="985" y2="220" stroke="#333" stroke-width="3"/>
    <path d="M930 300 q35 -20 70 0" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M920 315 q45 -28 90 0" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.5"/>
    <text x="965" y="400" text-anchor="middle" font-size="12" fill="#333">RF carrier</text>
    <text x="965" y="416" text-anchor="middle" font-size="12" fill="#333">(AM)</text>
  </g>

  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#555">
    Core 1 runs a hard real-time loop with no slack; all Bluetooth/DTMF/logging work stays on Core 0.
  </text>
  <text x="500" y="520" text-anchor="middle" font-size="12" fill="#555">
    Carrier frequency is set at boot and can be retuned live via a DTMF sequence — see "DTMF remote tuning".
  </text>
</svg>
